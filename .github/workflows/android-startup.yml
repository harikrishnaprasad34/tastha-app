name: Android installed APK startup check
on:
  workflow_run:
    workflows: [Android verification and test APK]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact_id:
        description: APK artifact ID (leave blank for the latest successful build)
        default: ""
        required: false
permissions:
  contents: read
  actions: read
jobs:
  startup:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Download APK from the successful build
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -z "$ARTIFACT_ID" ]; then
            if [ -z "$SOURCE_RUN" ]; then
              SOURCE_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
            fi
            ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" --jq '.artifacts[] | select(.name == "tastha-android-development-apk" and .expired == false) | .id' | head -1)
          fi
          test -n "$ARTIFACT_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > apk.zip
          unzip apk.zip -d apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p startup-results
            adb install apk/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.tastha.app/.MainActivity
            sleep 25
            adb logcat -d > startup-results/logcat.txt
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml startup-results/window.xml
            adb exec-out screencap -p > startup-results/screen.png
            adb shell pidof com.tastha.app
            ! grep -E 'FATAL EXCEPTION|Fatal signal|ReactNativeJS:.*(Error:|Exception)' startup-results/logcat.txt
            python3 scripts/check-responsive-ui.py
            ! grep -E 'FATAL EXCEPTION|Fatal signal|ReactNativeJS:.*(Error:|Exception)' startup-results/responsive-logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-results
          path: startup-results/
